name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Ensure debug.keystore exists
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
      - name: Test and build (debug + release)
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          AI_KEY: ${{ secrets.AI_KEY }}
        run: |
          set -o pipefail
          gradle testDebugUnitTest assembleDebug assembleRelease --stacktrace 2>&1 | tee build.log
      - name: Save error summary on failure
        if: failure()
        run: |
          mkdir -p /tmp/lg
          { grep -E "^e: |^w: .*error|error:|FAILED|What went wrong|Execution failed|Unresolved reference|Could not|AssertionError|expected:" build.log | head -80; echo "----- tests -----"; find app/build/test-results -name "*.xml" -exec grep -l "<failure" {} \; -exec grep -A5 "<failure" {} \; 2>/dev/null | head -60; echo "----- tail -----"; tail -80 build.log; } > /tmp/lg/errors.txt || true
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan build-logs
          git rm -rf . -q
          cp /tmp/lg/errors.txt errors.txt
          git add errors.txt
          git commit -q -m "build errors for ${{ github.sha }}"
          git push -f origin build-logs
      - name: Collect APKs
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VER=$VER" >> $GITHUB_ENV
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Khotwa-AI-$VER.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "out/Khotwa-AI-$VER-debug.apk"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: khotwa-apk
          path: out/*.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${VER}-build-${{ github.run_number }}"
          {
            echo "## خُطوة AI ${VER}"
            echo
            echo "ثبّت الملف Khotwa-AI-${VER}.apk (النسخة السريعة المحسّنة). يعمل التحديث فوق النسخة السابقة دون حذفها."
            echo
            if [ -f CHANGELOG.md ]; then awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2; fi
          } > notes.md
          gh release create "$TAG" out/*.apk --title "خُطوة AI ${VER}" --notes-file notes.md --target "${{ github.sha }}" --latest
